apiVersion: apps/v1
kind: Deployment
metadata:
  name: movieservice
  labels:
    app: movieservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movieservice
  template:
    metadata:
      labels:
        app: movieservice
   
    spec:
      containers:
        - name: movieservice
          image: punsophy678/movieservice
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/moviedb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD    
              value: root1234
          
---
apiVersion: v1
kind: Service
metadata:
  name: movieservice
spec:
  type: NodePort
  selector:
    app: movieservice
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30107

